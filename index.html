<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Plano de Treino</title>

<meta name="description" content="Organize seu plano de treino semanal, registre a carga usada em cada exercício e acompanhe sua evolução — tudo salvo só no seu aparelho, sem contas nem coleta de dados.">
<meta property="og:title" content="Plano de Treino">
<meta property="og:description" content="App de treino instalável com registro de carga por exercício. Seus dados ficam só no seu aparelho.">
<meta property="og:type" content="website">
<meta property="og:image" content="icons/icon-512.png">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b4b4b">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="container">

    <header class="header">
        <div class="header-titulo" id="headerTitulo"></div>
        <p class="tagline">Organize sua semana de treino, registre a carga de cada exercício e acompanhe sua evolução.</p>
        <div class="objetivo" id="headerObjetivo"></div>

        <div class="toolbar">
            <button id="btnEditar">Editar</button>
            <button id="btnSalvar" class="primario" hidden>Salvar</button>
            <button id="btnCancelar" class="perigo" hidden>Cancelar</button>
            <button id="btnExportar">Exportar JSON</button>
            <button id="btnImportar">Importar JSON</button>
            <input type="file" id="inputImportar" accept="application/json" hidden>
            <button id="btnImprimir">Imprimir</button>
            <button id="btnInstalar" class="primario" hidden>Instalar app</button>
        </div>
    </header>

    <div id="avisoBackup" class="aviso-backup" hidden>
        <span>Faz um tempo que você não exporta um backup do seu plano — seus dados ficam só neste aparelho.</span>
        <div class="aviso-backup-acoes">
            <button type="button" id="btnExportarAviso">Exportar agora</button>
            <button type="button" id="btnFecharAviso" aria-label="Fechar aviso">✕</button>
        </div>
    </div>

    <main class="dias" id="dias"></main>

    <footer class="footer">
        <p>Disciplina + Progressão Gradual = Consistência</p>
        <p class="footer-meta">
            <span id="appVersao"></span> · <a href="privacidade.html">Privacidade</a> · <a href="termos.html">Termos de uso</a>
        </p>
    </footer>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
