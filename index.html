<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Plano de Treino</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b4b4b">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="container">

    <header class="header">
        <div class="header-titulo" id="headerTitulo"></div>
        <div class="objetivo" id="headerObjetivo"></div>

        <div class="toolbar">
            <button id="btnEditar">Editar</button>
            <button id="btnSalvar" class="primario" hidden>Salvar</button>
            <button id="btnCancelar" class="perigo" hidden>Cancelar</button>
            <button id="btnExportar">Exportar JSON</button>
            <button id="btnImportar">Importar JSON</button>
            <input type="file" id="inputImportar" accept="application/json" hidden>
            <button id="btnImprimir">Imprimir</button>
        </div>
    </header>

    <main class="dias" id="dias"></main>

    <footer class="footer">
        Disciplina + Progressão Gradual = Consistência
    </footer>

</div>

<script src="js/app.js"></script>
</body>
</html>
