<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Plano de Treino</title>

<meta name="description" content="Organize seu plano de treino semanal, com exercícios, repetições e séries — tudo salvo só no seu aparelho, sem contas nem coleta de dados.">
<meta property="og:title" content="Plano de Treino">
<meta property="og:description" content="App de treino instalável para organizar sua semana de exercícios. Seus dados ficam só no seu aparelho.">
<meta property="og:type" content="website">
<meta property="og:image" content="icons/icon-512.png">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b4b4b">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="container">

    <header class="header">
        <div class="header-top">
            <div class="header-emblema" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2.5" y="9" width="2.6" height="6" rx="1"></rect>
                    <rect x="18.9" y="9" width="2.6" height="6" rx="1"></rect>
                    <rect x="5.6" y="7" width="2.2" height="10" rx="1"></rect>
                    <rect x="16.2" y="7" width="2.2" height="10" rx="1"></rect>
                    <line x1="7.8" y1="12" x2="16.2" y2="12"></line>
                </svg>
            </div>
            <div class="header-titulo-bloco">
                <div class="header-eyebrow">Seu plano</div>
                <div class="header-titulo" id="headerTitulo"></div>
            </div>
            <button type="button" id="btnInstalar" class="icone-btn instalar" hidden title="Instalar app" aria-label="Instalar app">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"></rect><line x1="10.5" y1="18.2" x2="13.5" y2="18.2"></line><path d="M12 8v5"></path><path d="M9.8 11.2 12 13.4l2.2-2.2"></path></svg>
            </button>
            <div class="menu-wrap">
                <button type="button" id="btnMenu" class="icone-btn" aria-haspopup="true" aria-expanded="false" aria-label="Mais opções">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
                </button>
                <div class="menu-dropdown" id="menuDropdown" hidden>
                    <button type="button" id="btnExportar" class="item-menu">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"></path><path d="M7.5 10.5 12 15l4.5-4.5"></path><path d="M4 16.5v2A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5v-2"></path></svg>
                        Exportar
                    </button>
                    <button type="button" id="btnImportar" class="item-menu">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"></path><path d="M7.5 8.5 12 4l4.5 4.5"></path><path d="M4 16.5v2A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5v-2"></path></svg>
                        Importar
                    </button>
                    <input type="file" id="inputImportar" accept="application/json" hidden>
                    <button type="button" id="btnImprimir" class="item-menu">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V4h12v5"></path><rect x="4" y="9" width="16" height="8" rx="1.5"></rect><path d="M6 14h12v6H6z"></path></svg>
                        Imprimir
                    </button>
                </div>
            </div>
        </div>

        <div class="header-divisor"></div>

        <div class="objetivo" id="headerObjetivo"></div>
    </header>

    <div id="avisoBackup" class="aviso-backup" hidden>
        <span>Faz um tempo que você não exporta um backup do seu plano — seus dados ficam só neste aparelho.</span>
        <div class="aviso-backup-acoes">
            <button type="button" id="btnExportarAviso">Exportar agora</button>
            <button type="button" id="btnFecharAviso" aria-label="Fechar aviso">✕</button>
        </div>
    </div>

    <main class="dias" id="dias"></main>

    <footer class="footer">
        <p class="footer-meta">
            <span id="appVersao"></span> · <a href="privacidade.html">Privacidade</a> · <a href="termos.html">Termos de uso</a>
        </p>
    </footer>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
